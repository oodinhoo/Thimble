name: CI
on:
  push:
    branches: [main]
    # Documentation only: nothing to build. A change touching any other file still runs it.
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  # Every pull request runs it, docs included: "build" is a required check to merge, and a
  # skipped workflow would leave it pending forever.
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its outdated build. Each build of main gets its own
# group: a shared one would still drop pending runs, whatever cancel-in-progress says.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Linux: the platform of most Paper servers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      # Gradle cache, and validation of the wrapper jar against the known Gradle checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: bash gradlew build
      # The plugin jar of this commit, downloadable from the run summary.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thimble-jar
          path: build/libs/*.jar
