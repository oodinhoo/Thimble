  deleted: "<green>Arene <white><arena></white> supprimee.</green>"
  disabled: "<red>L'arene <white><arena></white> est desactivee.</red>"
  incomplete: "<red>Arene incomplete : <white><missing></white></red>"
  enabled-ok: "<green>Arene <white><arena></white> activee.</green>"
  disabled-ok: "<yellow>Arene <white><arena></white> desactivee.</yellow>"
  position-set: "<green><what> defini pour l'arene <white><arena></white>.</green>"
  corner-set: "<green>Coin <white><corner></white> defini <dark_gray>(<white><pos></white>)</dark_gray>. Cases d'eau detectees : <white><water></white>, surface a Y=<white><y></white>.</green>"
