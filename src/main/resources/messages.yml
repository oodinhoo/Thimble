board:
  set: "<green>Tableau du classement pose a ta position.</green>"
  cleared: "<yellow>Tableau du classement retire.</yellow>"

# Texte du panneau flottant du classement (TextDisplay), lignes separees par le plugin.
leaderboard:
  title: "<gradient:#38bdf8:#818cf8><bold>CLASSEMENT</bold></gradient>"
  empty: "<gray>Aucune partie jouee pour l'instant.</gray>"
  line: "<gray><rank>.</gray> <white><player></white> <dark_gray>|</dark_gray> <gold><wins></gold> <gray>win</gray> <dark_gray>|</dark_gray> <aqua><thimbles></aqua> <gray>dac</gray>"
  last-header: "<dark_gray>-----</dark_gray> <white>Derniere partie</white> <dark_gray>(<arena>)</dark_gray> <dark_gray>-----</dark_gray>"
  last-none: "<gray>-</gray>"
  last-winner: "<gold><bold><player></bold></gold> <gray>remporte la derniere partie</gray>"
  last-line: "<gray><rank>.</gray> <white><player></white> <dark_gray>|</dark_gray> <gray><hits> cases</gray> <dark_gray>|</dark_gray> <aqua><thimbles> dac</aqua>"

help:
  header: "<gray>Commandes du <white>de a coudre</white> :</gray>"
  player: |-
    <dark_gray>-</dark_gray> <white>/th join [arene]</white> <gray>: rejoindre une partie</gray>
    <dark_gray>-</dark_gray> <white>/th solo [arene]</white> <gray>: partie d'entrainement en solo</gray>
    <dark_gray>-</dark_gray> <white>/th spectate <arene></white> <gray>: observer une partie</gray>
    <dark_gray>-</dark_gray> <white>/th leave</white> <gray>: quitter la partie ou l'observation</gray>
    <dark_gray>-</dark_gray> <white>/th list</white> <gray>: lister les arenes</gray>
  admin: |-
    <dark_gray>-</dark_gray> <white>/th admin wand <arene></white> <gray>: configuration guidee en 4 clics</gray>
    <dark_gray>-</dark_gray> <white>/th admin create|delete <arene></white>
    <dark_gray>-</dark_gray> <white>/th admin setwait|setjump|setspectator <arene></white> <gray>(a ta position)</gray>
    <dark_gray>-</dark_gray> <white>/th admin pos1|pos2 <arene></white> <gray>: coins de la piscine</gray>
    <dark_gray>-</dark_gray> <white>/th admin setsurface <arene> [y]</white>
    <dark_gray>-</dark_gray> <white>/th admin set <arene> <min|max|lives|timeout> <valeur></white>
    <dark_gray>-</dark_gray> <white>/th admin palette <arene> <add|remove|clear|list> [bloc]</white>
    <dark_gray>-</dark_gray> <white>/th admin enable|disable|info|restore <arene></white>
    <dark_gray>-</dark_gray> <white>/th admin forcestart|forcestop <arene></white>
    <dark_gray>-</dark_gray> <white>/th admin setboard|clearboard</white> <gray>: panneau du classement, a ta position</gray>
    <dark_gray>-</dark_gray> <white>/th admin lang <fr|en></white> <gray>: langue des textes</gray>
    <dark_gray>-</dark_gray> <white>/th admin reload</white>

