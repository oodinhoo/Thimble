  value-set: "<green><key> = <white><value></white> pour l'arene <white><arena></white>.</green>"
  restored: "<green>Piscine de l'arene <white><arena></white> restauree.</green>"
  busy: "<red>Une partie est en cours dans l'arene <white><arena></white>. Utilise <white>/th admin forcestop <arena></white>.</red>"
