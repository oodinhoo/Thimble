# ---------------------------------------------------------------------------
#  Thimble - mini-jeu du "de a coudre"
#  Durees en secondes sauf mention contraire.
# ---------------------------------------------------------------------------

# Langue des textes : en (messages_en.yml) ou fr (messages.yml). Modifiable en jeu avec
# /th admin lang <fr|en>, sans arreter les parties.
language: en

game:
  # Decompte avant le demarrage, une fois le minimum de joueurs atteint.
  countdown-seconds: 15
  # Decompte raccourci lorsque l'arene est pleine.
  countdown-full-seconds: 5
  # Delai entre la fin de la partie et le retour au point de depart.
  end-delay-seconds: 8
  # Immobilisation sur le plongeoir avant que le joueur puisse sauter.
  freeze-seconds: 1
  # Temps passe dans l'eau apres un saut reussi, avant le retour aux gradins.
  splash-pause-seconds: 2
  # Hauteur du point de vue au-dessus de la piscine pour choisir la case bonus.
  bonus-view-height: 12
  # Temps laisse au joueur pour choisir sa case bonus apres un de a coudre.
  # 0 = la case supplementaire est tiree au sort immediatement.
  bonus-select-seconds: 8
  # Delai pendant lequel la place d'un joueur deconnecte est gardee. 0 = pas de reprise.
  rejoin-grace-seconds: 60
  # Un joueur qui rejoint une partie deja lancee la regarde au lieu d'etre refuse.
  wait-as-spectator: true

# Comportement lorsqu'il ne reste plus aucune case d'eau :
#   true  = la piscine est remise a neuf et la partie continue
#   false = la partie s'arrete sans vainqueur
refill-when-full: true

# Blocs de couleur attribues aux joueurs, dans l'ordre.
# Chaque arene peut definir sa propre palette (/th admin palette).
default-palette:
  - RED_WOOL
  - BLUE_WOOL
  - LIME_WOOL
  - YELLOW_WOOL
  - MAGENTA_WOOL
  - ORANGE_WOOL
  - LIGHT_BLUE_WOOL
  - BLACK_WOOL

# Classement persistant du serveur, affiche sur un panneau flottant (/th admin setboard).
leaderboard:
  # Nombre de joueurs affiches dans le TOP.
  size: 10

# Habillage. Passer une entree a false la desactive entierement.
ui:
  titles: true
  actionbar: true
  sounds: true
  bossbar: true
  scoreboard: true
  particles: true
  # Le panneau flottant du classement. Les stats continuent d'etre comptees si false,
  # seul l'affichage disparait.
  leaderboard: true
  # Couleur du joueur sur la barre de localisation (le "radar") et de son nom, assortie a
  # son bloc. Passe par une equipe de scoreboard, seul levier serveur disponible.
  radar: true
