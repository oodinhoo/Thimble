# ---------------------------------------------------------------------------
#  Thimble - the "thimble" minigame (de a coudre)
#  Durations in seconds unless stated otherwise.
# ---------------------------------------------------------------------------

# Text language: en (messages_en.yml) or fr (messages.yml). Can be changed in game with
# /th admin lang <fr|en>, without stopping games.
language: en

game:
  # Countdown before the start, once the minimum number of players is reached.
  countdown-seconds: 15
  # Shortened countdown when the arena is full.
  countdown-full-seconds: 5
  # Delay between the end of the game and the return to the starting point.
  end-delay-seconds: 8
  # Freeze on the diving board before the player can jump.
  freeze-seconds: 1
  # Time spent in the water after a successful jump, before going back to the stands.
  splash-pause-seconds: 2
  # Height of the viewpoint above the pool to pick the bonus block.
  bonus-view-height: 12
  # Time given to the player to pick their bonus block after a thimble.
  # 0 = the extra block is picked at random right away.
  bonus-select-seconds: 8
  # How long a disconnected player's seat is kept. 0 = no rejoin.
  rejoin-grace-seconds: 60
  # A player joining a game already running watches it instead of being refused.
  wait-as-spectator: true

# Behaviour when not a single water block is left:
#   true  = the pool is refilled and the game goes on
#   false = the game stops with no winner
refill-when-full: true

# Colored blocks assigned to players, in order.
# Each arena can define its own palette (/th admin palette).
default-palette:
  - RED_WOOL
  - BLUE_WOOL
  - LIME_WOOL
  - YELLOW_WOOL
  - MAGENTA_WOOL
  - ORANGE_WOOL
  - LIGHT_BLUE_WOOL
  - BLACK_WOOL

# Persistent server leaderboard, shown on a floating panel (/th admin setboard).
leaderboard:
  # Number of players shown in the TOP.
  size: 10

# Presentation. Setting an entry to false turns it off entirely.
ui:
  titles: true
  actionbar: true
  sounds: true
  bossbar: true
  scoreboard: true
  particles: true
  # The floating leaderboard panel. Stats are still counted if false,
  # only the display goes away.
  leaderboard: true
  # Player color on the locator bar (the "radar") and on their name, matching
  # their block. Goes through a scoreboard team, the only server-side lever available.
  radar: true
