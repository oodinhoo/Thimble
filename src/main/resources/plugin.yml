name: Thimble
version: '${version}'
main: fr.thimble.ThimblePlugin
api-version: '26.3'
description: Thimble minigame (de a coudre) - jump into the pool and place a block.
authors: [ Odinho ]
commands:
  thimble:
    description: Main command of the thimble minigame.
    aliases: [ th, deacoudre, dac ]
    usage: /th help
permissions:
  thimble.play:
    description: Join and leave a game.
    default: true
  thimble.spectate:
    description: Watch a running game.
    default: true
  thimble.admin:
    description: Create and configure arenas.
    default: op
